name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS, full build with libass)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix)/opt/ffmpeg-full/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: FFmpeg version
        run: ffmpeg -hide_banner -version

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

      - name: Unit tests
        run: npx vitest run test/unit

      - name: Integration tests
        run: npx vitest run test/integration
        env:
          # Real Whisper on macOS only (the Linux prebuilt binary is slow).
          VIBE_TEST_WHISPER: ${{ runner.os == 'macOS' && '1' || '0' }}

      - name: End-to-end tests (MCP client over stdio)
        run: npx vitest run test/e2e

      - name: Package check
        run: npm pack --dry-run

  # A buyer's computer: no Node.js 22, no FFmpeg. Runs the real one-line installer
  # (with a local test license server), then starts vibeediting the way Cursor would
  # and runs the render tests on the FFmpeg the installer downloaded.
  fresh-install:
    name: Installer on a fresh ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VIBE_FORCE_PORTABLE_NODE: '1'
      VIBE_FFMPEG: managed
      VIBE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make the npm package the installer will use
        shell: bash
        run: |
          npm pack
          echo "VIBE_PACKAGE=$(node -p "require('path').resolve('vibeediting-mcp-' + require('./package.json').version + '.tgz')")" >> "$GITHUB_ENV"
      - name: Start the test license server (macOS, Linux)
        if: runner.os != 'Windows'
        run: nohup node node_modules/tsx/dist/cli.mjs scripts/test-license-server.mts > license-server.log 2>&1 &
      - name: Wait for the license server
        if: runner.os != 'Windows'
        shell: bash
        run: for i in $(seq 1 120); do node -e "fetch('http://127.0.0.1:8787/').then(()=>process.exit(0),()=>process.exit(1))" && exit 0; sleep 1; done; exit 1
      - name: Pretend Cursor is installed
        shell: bash
        run: mkdir -p "$HOME/.cursor"

      - name: Run install.sh (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh install/install.sh --license VIBE-2345-6789-ABCD-EFGH --no-model --yes
      - name: Run install.ps1 the way buyers do (irm | iex, Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows ends a step's background processes with the step, so the test
          # license server runs inside this step.
          $server = Start-Process -FilePath node -ArgumentList 'node_modules/tsx/dist/cli.mjs','scripts/test-license-server.mts' -RedirectStandardOutput license-server.log -RedirectStandardError license-server.err -WindowStyle Hidden -PassThru
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/ | Out-Null; $up = $true } catch { if ($_.Exception.Response) { $up = $true } else { Start-Sleep 1 } }
          }
          if (-not $up) { Write-Host 'license server did not start'; exit 1 }
          $env:VIBE_SETUP_ARGS = '--license VIBE-2345-6789-ABCD-EFGH --no-model --yes'
          Get-Content install/install.ps1 -Raw | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Start vibeediting from the Cursor config and check it
        run: npx tsx scripts/check-installed.mts
      - name: Use the downloaded FFmpeg for the tests
        shell: bash
        run: |
          dir="$HOME/.vibeediting/bin/ffmpeg-6.1.1"
          [ "$RUNNER_OS" = Windows ] && dir="$(cygpath -w "$USERPROFILE")\\.vibeediting\\bin\\ffmpeg-6.1.1"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Render tests on the downloaded FFmpeg
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -filters | grep -E ' (ass|subtitles) '
          npm run build
          npx vitest run test/integration test/e2e
      - name: License server log
        if: always()
        shell: bash
        run: cat license-server.log license-server.err 2>/dev/null || true

  # The one-click extension for the Claude app (macOS and Windows).
  extension:
    name: Claude app extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mcpb
      - name: Start the extension like the Claude app does
        run: npx tsx scripts/smoke-mcpb.mts
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: vibeediting.mcpb
          path: build/vibeediting.mcpb
