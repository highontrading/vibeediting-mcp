name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS, full build with libass)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix)/opt/ffmpeg-full/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: FFmpeg version
        run: ffmpeg -hide_banner -version

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

      - name: Unit tests
        run: npx vitest run test/unit

      - name: Integration tests
        run: npx vitest run test/integration
        env:
          # Real Whisper on macOS only (the Linux prebuilt binary is slow).
          VIBE_TEST_WHISPER: ${{ runner.os == 'macOS' && '1' || '0' }}

      - name: End-to-end tests (MCP client over stdio)
        run: npx vitest run test/e2e

      - name: Package check
        run: npm pack --dry-run
